[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vorschau: nicht indexieren. Vor dem Livegang diesen Block entfernen
# und build-Befehl auf "npm run build:live" stellen.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Weiterleitungen der alten Webflow-Adressen (Runde 04)
[[redirects]]
  from = "/uber-uns"
  to = "/ueber-mich/"
  status = 301
  force = true

[[redirects]]
  from = "/uber-uns/"
  to = "/ueber-mich/"
